name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: |
          cd LAB_01/lab01
          chmod +x mvnw
          ./mvnw -B verify

      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: |
          cd LAB_01\lab01
          .\mvnw.cmd -B verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: LAB_01/lab01/target/*.jar
          if-no-files-found: error
          